spring:
  application:
    name: live-score-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:livescore}
    username: ${DB_USER:livescore}
    password: ${DB_PASSWORD:livescore}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: live-score-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.arshat.livescore.dto.MatchEventMessage
        spring.json.use.type.headers: false

app:
  kafka:
    match-events-topic: match-events
  security:
    max-request-size-bytes: 2097152

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.arshat.livescore: INFO
